          rows_by_version:
            v1: 2000
            v2: 4000
          system_prompts:
          - Отвечай на русском языке о подтверждённых экзопланетах. Используй 
            только факт из вопроса и архивную запись; не домысливай недостающие 
            сведения.
          - Ты помощник по астрономическим справочным данным. Дай краткий точный
            ответ по указанной экзопланете без предположений.
          - Ответь на вопрос об экзопланете на русском языке. Числа и единицы 
            измерения должны соответствовать архивным данным.
          - Используй данные NASA Exoplanet Archive для короткого ответа. Если 
            факт не указан, не заменяй его догадкой.
          - Пиши лаконичный ответ о подтверждённой экзопланете; сохраняй 
            название объекта и корректные единицы измерения.
        paths.metrics_collect: metrics/collect.json
        paths.raw: data/raw.jsonl
    outs:
