# Единственная точка конфигурации ДЗ 5. В src/ нет ни имени модели,
# ни learning rate, ни путей.
model:
  name: "Qwen/Qwen3-0.6B"
  device: "auto"            # auto | cpu | cuda | mps
  # Базовые веса в bfloat16: они заморожены, точность им не нужна, а память
  # и время уходят вдвое. Сами матрицы LoRA peft держит в float32 — там идут
  # крошечные обновления AdamW. На старом CPU без bf16 ставьте float32.
  dtype: "bfloat16"
  enable_thinking: false    # как в ДЗ 4: шаблон должен совпадать с обучением

data:
  # Выход стадии tokenize из ДЗ 4. У студента — свой путь.
  train: "data/tokenized/train.pt"
  val: "data/tokenized/val.pt"

lora:
  r: 8
  alpha: 16                 # итоговый масштаб апдейта alpha / r = 2
  dropout: 0.05
  # Только проекции внимания и MLP. embed_tokens и lm_head — это 155 млн
  # параметров каждый; в modules_to_save они уезжают в адаптер целиком.
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  seed: 42
  epochs: 1
  batch_size: 2
  grad_accum: 4             # эффективный батч = 8: память как у батча 2, шаг как у батча 8
  lr: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  eval_every: 10            # шагов оптимизатора между замерами val loss
  # Логиты на весь словарь: 2 примера x 512 токенов x 151 936 x 4 байта = 0,6 ГБ.
  # Батч 8 на оценке — уже 2,5 ГБ одних логитов, и ноутбук уходит в своп.
  eval_batch_size: 2
  gradient_checkpointing: true   # без него на ноутбуке с 16–32 ГБ не влезает
  max_steps: null           # null — по эпохам; число — обрезать (smoke-тесты)

# Эксперимент по слоям: второй прогон без адаптеров на первых N слоях.
variants:
  - name: "all_layers"
    freeze_first: 0
  - name: "freeze14"
    freeze_first: 14

compare:
  max_new_tokens: 40
  # Фиксированные вопросы из val ДЗ 3: эти звёздные системы не входят в train.
  prompts:
    - "Каков орбитальный период экзопланеты Kepler-17 b?"
    - "Какова оценка массы экзопланеты HD 28192 b в массах Земли?"
    - "Каков орбитальный период экзопланеты HD 214823 b?"
    - "Какова оценка массы экзопланеты K2-179 b в массах Земли?"
    - "Каков радиус экзопланеты Kepler-44 b в радиусах Земли?"
  system: "Ответь на вопрос об экзопланете на русском языке. Числа и единицы измерения должны соответствовать архивным данным."
  # Эталонные ответы из тех же пяти записей val.jsonl ДЗ 3, только для отчёта.
  # Эти строки не передаются модели при генерации.
  expected_answers:
    - "Орбитальный период Kepler-17 b составляет 1.486 суток."
    - "Оценка массы HD 28192 b — 99.8 масс Земли."
    - "Орбитальный период HD 214823 b составляет 1855 суток."
    - "Оценка массы K2-179 b — 6.86 масс Земли."
    - "Радиус Kepler-44 b составляет 12.22 радиусов Земли."

paths:
  models: "models"
  metrics: "metrics"
  curves: "docs/curves.png"
  compare: "docs/compare.md"
