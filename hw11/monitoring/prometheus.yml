global:
  scrape_interval: 3s
  evaluation_interval: 3s
rule_files: [/config/alerts.yml]
scrape_configs:
  - job_name: api
    kubernetes_sd_configs: [{role: pod}]
    relabel_configs:
    - {source_labels: [__meta_kubernetes_pod_label_app], regex: hw11, action: keep}
    - {source_labels: [__meta_kubernetes_pod_container_port_name], regex: http, action: keep}
    - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
  - job_name: state
    static_configs: [{targets: ['kube-state:8080']}]
  - job_name: cadvisor
    scheme: https
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    kubernetes_sd_configs: [{role: node}]
    relabel_configs:
      - {target_label: __address__, replacement: kubernetes.default.svc:443}
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
